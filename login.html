<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Dashboard Pengadaan Kab. Kuningan</title>
<style>
  :root{
    --navy-950:#0d1b2e;
    --navy-800:#16273f;
    --navy-700:#1e3455;
    --paper:#f6f5f1;
    --line:#dcd9d0;
    --ink:#1c1f24;
    --ink-soft:#5b6270;
    --red:#a3312a;
    --red-bg:#fbeceb;
    --font-head: "Iowan Old Style","Georgia","Times New Roman",serif;
    --font-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--navy-950);color:var(--ink);
    font-family:var(--font-body);
    display:flex;align-items:center;justify-content:center;
    padding:1.5rem;
  }
  .card{
    background:var(--paper);border-radius:8px;padding:2.2rem 2rem;
    width:100%;max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .kop{font-size:.72rem;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:.4rem;}
  h1{font-family:var(--font-head);font-weight:600;font-size:1.5rem;margin:0 0 1.4rem;}
  label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.3rem;color:var(--ink-soft);}
  input{
    width:100%;padding:.65rem .8rem;border:1px solid var(--line);border-radius:5px;
    font-size:.95rem;margin-bottom:1rem;background:#fff;
  }
  button{
    width:100%;padding:.75rem;border:none;border-radius:5px;
    background:var(--navy-950);color:#fff;font-size:.95rem;font-weight:600;
    cursor:pointer;
  }
  button:hover{background:var(--navy-700);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .error{
    display:none;background:var(--red-bg);color:var(--red);
    padding:.6rem .8rem;border-radius:5px;font-size:.84rem;margin-bottom:1rem;
  }
</style>
</head>
<body>

<div class="card">
  <div class="kop">Kabupaten Kuningan &middot; Pekerjaan Konstruksi 2026</div>
  <h1>Masuk ke Dashboard</h1>

  <div class="error" id="errorMsg"></div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">

    <label for="password">Kata Sandi</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="loginBtn">Masuk</button>
  </form>
</div>

<script type="module">
  import { auth } from './firebase-config.js';
  import { signInWithEmailAndPassword, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // Kalau sudah login, langsung lempar ke dashboard.
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = 'index.html';
  });

  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');

  const errorText = (code) => {
    switch(code){
      case 'auth/invalid-email': return 'Format email tidak valid.';
      case 'auth/user-not-found':
      case 'auth/invalid-credential':
      case 'auth/wrong-password': return 'Email atau kata sandi salah.';
      case 'auth/too-many-requests': return 'Terlalu banyak percobaan. Coba lagi nanti.';
      default: return 'Gagal masuk. Silakan coba lagi.';
    }
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Memproses…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'index.html';
    } catch (err) {
      errorMsg.textContent = errorText(err.code);
      errorMsg.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Masuk';
    }
  });
</script>

</body>
</html>
